<!DOCTYPE html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#070a11" />
    <title>Página no encontrada | NEXORA</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px 16px;
        background: #06080d;
        color: #f2f5fa;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      main {
        width: min(440px, 100%);
        padding: 32px 28px;
        border: 1px solid rgba(196, 216, 240, 0.16);
        border-radius: 18px;
        background: linear-gradient(150deg, rgba(33, 47, 68, 0.86), rgba(12, 18, 29, 0.82));
        text-align: center;
      }
      small { color: #7df0cb; font-family: ui-monospace, monospace; letter-spacing: 0.14em; }
      h1 { margin: 12px 0 8px; font-size: 28px; }
      p { margin: 0 0 24px; color: #96a2b6; line-height: 1.6; }
      a {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        padding: 0 20px;
        border-radius: 9px;
        background: linear-gradient(115deg, #a3edce, #b8f4d5 58%, #c7f2b5);
        color: #08201a;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible { outline: 2px solid #7df0cb; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <small>ERROR 404</small>
      <h1>Esta página no existe.</h1>
      <p>Puede que el enlace esté mal escrito o que la dirección haya cambiado. Todo NEXORA vive en su página principal.</p>
      <a href="/">Volver al inicio de NEXORA</a>
    </main>
  </body>
</html>
