<!DOCTYPE html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NEXORA | Mercado cripto en pesos colombianos y simulador de operaciones</title>
    <meta
      name="description"
      content="Consulta precios de criptomonedas en pesos colombianos, analiza su evolución de siete días y simula compras y ventas sin dinero real con NEXORA."
    />
    <meta name="theme-color" content="#07090e" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="NEXORA" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NEXORA" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:title" content="NEXORA | Finanzas digitales en movimiento" />
    <meta
      property="og:description"
      content="Precios de criptomonedas en pesos colombianos y un simulador de operaciones sin dinero real."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="NEXORA | Finanzas digitales en movimiento" />
    <meta
      name="twitter:description"
      content="Precios de criptomonedas en pesos colombianos y un simulador de operaciones sin dinero real."
    />

    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- Market data providers: open the connections while the bundle loads. -->
    <link rel="preconnect" href="https://api.coingecko.com" crossorigin />
    <link rel="dns-prefetch" href="https://open.er-api.com" />

    <style>
      /* Paint the brand background before the stylesheet arrives (no white flash). */
      html,
      body {
        background: #07090e;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; color: #eef2f8; font-family: system-ui, sans-serif">
        NEXORA necesita JavaScript habilitado para mostrar el mercado en vivo.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
